<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문의 | 정도클린</title>
<style>
:root { --blue: #1B6FC9; --blue-dark: #0F2A44; --teal: #12B0A6; --bg-soft: #F6FAFC; --text-body: #5B6B7D; --border: #E7EAEE; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: var(--blue-dark); line-height: 1.6; background: #fff; padding-bottom: 72px; }
a { text-decoration: none; color: inherit; }
ul { list-style: none; }
img { max-width: 100%; display: block; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.site-header { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 1px solid var(--border); }
.site-header .wrap { height: 60px; display: flex; align-items: center; justify-content: space-between; }
.site-header .logo img { height: 26px; }
.site-nav { display: none; gap: 28px; }
.site-nav a { font-size: 14px; font-weight: 700; color: var(--blue-dark); }
.site-nav a.active { color: var(--blue); }
.nav-toggle { font-size: 22px; background: none; border: none; color: var(--blue-dark); cursor: pointer; }
.header-call-btn { display: none; padding: 9px 18px; background: var(--blue); color: #fff; font-size: 13px; font-weight: 700; border-radius: 8px; }
.mobile-menu { display: none; flex-direction: column; background: #fff; border-bottom: 1px solid var(--border); }
.mobile-menu.open { display: flex; }
.mobile-menu a { padding: 14px 20px; font-size: 14px; font-weight: 700; border-top: 1px solid #F2F2F2; color: var(--blue-dark); }
.hero { background: linear-gradient(160deg, #EAF4FF 0%, #E7F8F4 100%); padding: 56px 0 48px; text-align: center; }
.hero .hero-logo { width: 180px; margin: 0 auto 20px; }
.hero h1 { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.hero p { font-size: 14px; color: var(--text-body); margin-bottom: 24px; }
.btn { display: inline-block; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-outline { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
.btn-block { display: block; width: 100%; text-align: center; }
.section { padding: 44px 0 8px; }
.section-title { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
.section-sub { font-size: 13px; color: var(--text-body); margin-bottom: 24px; }
.service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.service-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }
.service-card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; display: block; }
.service-card .card-foot { padding: 12px 14px; }
.service-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.service-card p { font-size: 12px; color: var(--text-body); }
.service-banner { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
.service-banner img { width: 100%; display: block; }
.trust-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 40px; }
.trust-item { text-align: center; padding: 18px 8px; background: var(--bg-soft); border-radius: 10px; }
.trust-item .label { font-size: 12px; font-weight: 700; color: var(--blue-dark); line-height: 1.5; }
.tabs { display: flex; gap: 8px; padding: 20px 0; flex-wrap: wrap; }
.tab { flex: 1; min-width: 70px; text-align: center; padding: 10px 6px; border-radius: 8px; font-size: 13px; font-weight: 700; border: 1px solid var(--border); color: var(--text-body); }
.tab.active { background: var(--blue); color: #fff; border: none; }
.detail-card { border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
.detail-card .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--blue); background: #EAF4FF; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
.detail-card h3 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.detail-card p { font-size: 14px; color: var(--text-body); }
.check-list li { font-size: 13px; color: #444; padding: 10px 0; border-bottom: 1px solid #F0F0F0; display: flex; align-items: center; gap: 8px; }
.check-list li:before { content: "✓"; color: var(--teal); font-weight: 700; }
.notice { background: var(--bg-soft); border-radius: 10px; padding: 18px 20px; font-size: 13px; color: var(--text-body); margin-bottom: 24px; }
.notice b { color: var(--blue-dark); }
.price-item { border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
.price-item h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.price-item p { font-size: 13px; color: var(--text-body); }
.price-item .basis { display: inline-block; margin-top: 10px; font-size: 12px; color: var(--teal); font-weight: 700; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px 0; }
.gallery-item { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
.gallery-img { height: 140px; background: linear-gradient(135deg, #DDEBF9, #D8F2EE); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #8A93A0; }
.gallery-label { padding: 10px 12px; font-size: 12px; font-weight: 700; }
.phone-card { background: var(--blue); border-radius: 16px; padding: 40px 24px; text-align: center; margin: 24px 0; }
.phone-card .label { font-size: 13px; color: #DCEBFB; margin-bottom: 10px; }
.phone-card .number { font-size: 28px; font-weight: 700; color: #fff; }
.phone-card .hint { font-size: 12px; color: #DCEBFB; margin-top: 12px; }
.info-box { background: var(--bg-soft); border-radius: 10px; padding: 18px 20px; font-size: 13px; color: var(--text-body); }
.info-box b { color: var(--blue-dark); }
.map-box { height: 260px; border-radius: 12px; background: repeating-linear-gradient(45deg, #F0F0F2, #F0F0F2 10px, #E9E9EC 10px, #E9E9EC 20px); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #999; border: 1px solid var(--border); margin-top: 12px; }
.address { font-size: 13px; color: var(--text-body); margin-top: 10px; text-align: center; }
.footer-cta { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); padding: 10px 16px; z-index: 100; }
.footer-cta .btn { width: 100%; }
.site-footer { margin-top: 60px; padding: 30px 0 90px; text-align: center; font-size: 12px; color: #A0A8B2; border-top: 1px solid var(--border); }
@media (min-width: 768px) {
  body { padding-bottom: 0; }
  .site-nav { display: flex; }
  .nav-toggle { display: none; }
  .header-call-btn { display: inline-block; }
  .mobile-menu { display: none !important; }
  .hero { padding: 90px 0 70px; }
  .hero .hero-logo { width: 220px; }
  .hero h1 { font-size: 34px; }
  .hero p { font-size: 16px; }
  .service-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .trust-row { max-width: 640px; margin-left: auto; margin-right: auto; }
  .gallery { grid-template-columns: repeat(4, 1fr); }
  .footer-cta { display: none; }
  .site-footer { padding: 40px 0; }
  .section { padding: 64px 0 8px; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html"><img src="logo.png" alt="정도클린"></a>
    <nav class="site-nav">
      <a href="index.html">메인</a>
      <a href="service.html">서비스</a>
      <a href="price.html">요금안내</a>
      <a href="portfolio.html">시공사례</a>
      <a href="contact.html" class="active">문의</a>
      <a href="about.html">회사소개</a>
    </nav>
    <a class="header-call-btn" href="tel:010-0000-0000">전화 상담</a>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴">≡</button>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html">메인</a>
    <a href="service.html">서비스</a>
    <a href="price.html">요금안내</a>
    <a href="portfolio.html">시공사례</a>
    <a href="contact.html">문의</a>
    <a href="about.html">회사소개</a>
  </div>
</header>
<section class="hero" style="padding:40px 0;">
  <div class="wrap">
    <h1 style="font-size:20px;">문의</h1>
    <p>전화 한 통이면 바로 상담이 시작됩니다</p>
  </div>
</section>
<div class="wrap" style="max-width:480px;">
  <a class="phone-card" href="tel:010-0000-0000" style="display:block;">
    <div class="label">지금 바로 전화 상담</div>
    <div class="number">📞 010-0000-0000</div>
    <div class="hint">탭하면 바로 전화 연결</div>
  </a>
  <div class="info-box">
    <b>전화 연결이 어려우신가요?</b><br>
    문자로 "현장 / 지역 / 필요 항목"을 남겨주시면 확인 후 순서대로 연락드립니다.
  </div>
</div>
<footer class="site-footer">
  <div class="wrap">© Jungdo Clean. All rights reserved.</div>
</footer>
<div class="footer-cta">
  <a class="btn btn-primary" href="tel:010-0000-0000">📞 지금 바로 전화 상담</a>
</div>
<script>
  document.getElementById('navToggle').addEventListener('click', function () {
    document.getElementById('mobileMenu').classList.toggle('open');
  });
</script>
</body>
</html>
